# Supabase local configuration.
#
# This file is normally generated by `supabase init`. The CLI was not available
# in the environment that scaffolded ticket 002, so it is committed by hand and
# kept minimal. It will be reconciled the first time someone runs the CLI
# locally (see ticket 003, which needs `supabase db reset` and
# `supabase gen types`). The schema is only ever changed via migration files in
# ./migrations — never through the dashboard.

# A string used to distinguish different Supabase projects on the same host.
project_id = "workount"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Next dev serves http://localhost:3000; keep these origins in lockstep with it
# so OAuth redirects aren't rejected as unregistered.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# ADR-0003: Google OAuth is the only sign-in provider. Configure the client id
# and secret via environment variables rather than committing secrets here.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
